name: YouTube crawler

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Tipo de busca
        required: true
        default: recent
        type: choice
        options:
          - recent
          - fill-ranking
          - ocr-only
      days:
        description: Dias para a busca recente (o preenchimento usa 365)
        required: true
        default: "3"
  schedule:
    - cron: "17 11,23 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/youtube-crawler.yml"
      - "backend/gc_radar/**"

permissions:
  contents: read

concurrency:
  group: youtube-crawler
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SITE_INGEST_TOKEN: ${{ secrets.SITE_INGEST_TOKEN }}
      SITE_ACCESS_TOKEN: ${{ secrets.SITE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore crawler database
        uses: actions/cache/restore@v4
        with:
          path: data/gc_radar.sqlite3
          key: gc-radar-db-${{ github.run_id }}
          restore-keys: gc-radar-db-

      - name: Seed supplied reference videos
        run: |
          mkdir -p data
          cd backend
          python -m gc_radar.cli --db ../data/gc_radar.sqlite3 add \
            https://youtu.be/WZeUJAw4pmU --channel Borkaz \
            --title "Ereb | Vazio (Invasão) 3f (1'32) | Grand Chase Classic" > /dev/null
          python -m gc_radar.cli --db ../data/gc_radar.sqlite3 add \
            https://youtu.be/V6O_9x6QTvw --channel Borkaz \
            --title "Ereb | Vazio (Pesadelo) 4F | Grand Chase Classic" > /dev/null
          python -m gc_radar.cli --db ../data/gc_radar.sqlite3 add \
            https://youtu.be/aTglQvuekIE --channel Borkaz \
            --title "Lupus | Vazio (Apocalipse) 3F Solo Sem poções | Grand Chase Classic" > /dev/null

      - name: Search recent YouTube videos
        if: ${{ (github.event_name == 'schedule') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'recent') || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[fill-ranking]') && !contains(github.event.head_commit.message, '[ocr]')) }}
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CRAWL_DAYS: ${{ inputs.days || '3' }}
        run: |
          mkdir -p data
          cd backend
          python -m gc_radar.cli --db ../data/gc_radar.sqlite3 crawl --days "$CRAWL_DAYS" > ../data/last-run.json

      - name: Fill Void Invasion 3F ranking
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'fill-ranking') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[fill-ranking]')) }}
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          mkdir -p data
          cd backend
          python -m gc_radar.cli --db ../data/gc_radar.sqlite3 fill-ranking --days 365 --max-results 25 > ../data/last-run.json

      - name: Install OCR tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr
          python -m pip install --disable-pip-version-check --upgrade --pre "yt-dlp[default,curl-cffi]"

      - name: Read missing times from video frames
        run: |
          cd backend
          python -m gc_radar.cli --db ../data/gc_radar.sqlite3 ocr-queue --limit 8 > ../data/last-run.json

      - name: Add report to workflow summary
        run: |
          echo '## GC Run Radar — descoberta do YouTube' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat data/last-run.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Send candidates to hosted queue
        if: ${{ env.SITE_INGEST_TOKEN != '' && env.SITE_ACCESS_TOKEN != '' }}
        run: |
          curl --fail-with-body --retry 2 \
            -H "Authorization: Bearer $SITE_INGEST_TOKEN" \
            -H "OAI-Sites-Authorization: Bearer $SITE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @data/last-run.json \
            https://gc-run-radar.gabrielsousaol872244.chatgpt.site/api/candidates

      - name: Save crawler database
        uses: actions/cache/save@v4
        with:
          path: data/gc_radar.sqlite3
          key: gc-radar-db-${{ github.run_id }}

      - name: Upload validation data
        uses: actions/upload-artifact@v4
        with:
          name: gc-radar-candidates-${{ github.run_number }}
          path: |
            data/gc_radar.sqlite3
            data/last-run.json
          retention-days: 30
