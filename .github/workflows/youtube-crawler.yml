name: YouTube crawler

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Tipo de busca
        required: true
        default: recent
        type: choice
        options:
          - recent
          - fill-ranking
          - sync-syntaxii
          - ocr-only
      days:
        description: Dias para a busca recente (o preenchimento usa 365)
        required: true
        default: "3"
  schedule:
    - cron: "17 11,23 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/youtube-crawler.yml"
      - "backend/gc_radar/**"

permissions:
  contents: write

concurrency:
  group: youtube-crawler
  cancel-in-progress: false

jobs:
  discover:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip-run]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SITE_INGEST_TOKEN: ${{ secrets.SITE_INGEST_TOKEN }}
      SITE_ACCESS_TOKEN: ${{ secrets.SITE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore crawler database
        uses: actions/cache/restore@v4
        with:
          path: data/gc_radar.sqlite3
          key: gc-radar-db-${{ github.run_id }}
          restore-keys: gc-radar-db-

      - name: Seed supplied reference videos
        run: |
          mkdir -p data
          cd backend
          python -m gc_radar.cli --db ../data/gc_radar.sqlite3 add \
            https://youtu.be/WZeUJAw4pmU --channel Borkaz \
            --title "Ereb | Vazio (Invasão) 3f (1'32) | Grand Chase Classic" > /dev/null
          python -m gc_radar.cli --db ../data/gc_radar.sqlite3 add \
            https://youtu.be/V6O_9x6QTvw --channel Borkaz \
            --title "Ereb | Vazio (Pesadelo) 4F | Grand Chase Classic" > /dev/null
          python -m gc_radar.cli --db ../data/gc_radar.sqlite3 add \
            https://youtu.be/aTglQvuekIE --channel Borkaz \
            --title "Lupus | Vazio (Apocalipse) 3F Solo Sem poções | Grand Chase Classic" > /dev/null
          python -m gc_radar.cli --db ../data/gc_radar.sqlite3 add \
            https://youtu.be/CD3mVzdsp0M --channel "Mira Lei" \
            --title "Grand Chase Classic - Void 1 Veigas Speedrun 1:27 (No Pots)" > /dev/null
          python -m gc_radar.cli --db ../data/gc_radar.sqlite3 add \
            https://youtu.be/5D4_AfVl2eU --channel Falonso \
            --title "Uno Void Invasion 3F Solo | Grand Chase Classic" > /dev/null

      - name: Sync public Syntaxii leaderboards
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'ocr-only') }}
        run: |
          mkdir -p data
          cd backend
          python -m gc_radar.cli --db ../data/gc_radar.sqlite3 import-syntaxii > ../data/last-run.json

      - name: Search recent YouTube videos
        if: ${{ (github.event_name == 'schedule') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'recent') || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[fill-ranking]') && !contains(github.event.head_commit.message, '[ocr]') && !contains(github.event.head_commit.message, '[sync-syntaxii]')) }}
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CRAWL_DAYS: ${{ inputs.days || '3' }}
        run: |
          mkdir -p data
          cd backend
          python -m gc_radar.cli --db ../data/gc_radar.sqlite3 crawl --days "$CRAWL_DAYS" > ../data/last-run.json

      - name: Fill Void Invasion 3F ranking
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'fill-ranking') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[fill-ranking]')) }}
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          mkdir -p data
          cd backend
          python -m gc_radar.cli --db ../data/gc_radar.sqlite3 fill-ranking --days 365 --max-results 25 > ../data/last-run.json

      - name: Install OCR tools
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'ocr-only') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[ocr]')) }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr
          python -m pip install --disable-pip-version-check --upgrade --pre \
            "yt-dlp[default,curl-cffi]" "yt-dlp-getpot-wpc"

      - name: Configure browser PO Token provider
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'ocr-only') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[ocr]')) }}
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$browser_path"
          echo "YOUTUBE_PO_BROWSER_PATH=$browser_path" >> "$GITHUB_ENV"

      - name: Load YouTube session
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'ocr-only') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[ocr]')) }}
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          if [ -n "$YOUTUBE_COOKIES_B64" ]; then
            echo "$YOUTUBE_COOKIES_B64" | base64 --decode > "$RUNNER_TEMP/youtube-cookies.txt"
            chmod 600 "$RUNNER_TEMP/youtube-cookies.txt"
            echo "YOUTUBE_COOKIES_FILE=$RUNNER_TEMP/youtube-cookies.txt" >> "$GITHUB_ENV"
          fi

      - name: Read missing times from video frames
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'ocr-only') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[ocr]')) }}
        env:
          YOUTUBE_USE_PO_TOKEN: "1"
        run: |
          cd backend
          python -m gc_radar.cli --db ../data/gc_radar.sqlite3 ocr-queue --limit 8 > ../data/last-run.json

      - name: Remove temporary YouTube session
        if: ${{ always() && ((github.event_name == 'workflow_dispatch' && inputs.mode == 'ocr-only') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[ocr]'))) }}
        run: rm -f -- "$RUNNER_TEMP/youtube-cookies.txt"

      - name: Add report to workflow summary
        run: |
          echo '## GC Run Radar — descoberta do YouTube' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat data/last-run.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Send candidates to hosted queue
        if: ${{ env.SITE_INGEST_TOKEN != '' && env.SITE_ACCESS_TOKEN != '' }}
        run: |
          curl --fail-with-body --retry 2 \
            -H "Authorization: Bearer $SITE_INGEST_TOKEN" \
            -H "OAI-Sites-Authorization: Bearer $SITE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @data/last-run.json \
            https://gc-run-radar.gabrielsousaol872244.chatgpt.site/api/candidates

      - name: Refresh public Vercel rankings
        if: ${{ env.SITE_INGEST_TOKEN != '' && env.SITE_ACCESS_TOKEN != '' }}
        run: |
          curl --fail-with-body --retry 2 \
            -H "OAI-Sites-Authorization: Bearer $SITE_ACCESS_TOKEN" \
            https://gc-run-radar.gabrielsousaol872244.chatgpt.site/api/candidates \
            | jq '{candidates: [], rankings: (.rankings // []), history: (.history // [])}' \
            > vercel-app/public/candidates.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vercel-app/public/candidates.json
          if ! git diff --cached --quiet; then
            git commit -m "[skip-run] Refresh public rankings"
            git push
          fi

      - name: Save crawler database
        uses: actions/cache/save@v4
        with:
          path: data/gc_radar.sqlite3
          key: gc-radar-db-${{ github.run_id }}

      - name: Upload validation data
        uses: actions/upload-artifact@v4
        with:
          name: gc-radar-candidates-${{ github.run_number }}
          path: |
            data/gc_radar.sqlite3
            data/last-run.json
          retention-days: 30
